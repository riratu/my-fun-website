<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Glimpse Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Lora', serif;
            color: #e0e0e0;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 600px;
            position: relative;
            z-index: 10;
            animation: fadeIn 2s ease-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: #ffffff;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
        }

        p {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #c0c0c0;
            margin-top: 0;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .decorative-line {
            width: 80px;
            height: 2px;
            background: linear-gradient(to right, transparent, #ffffff, transparent);
            margin: 2rem auto;
            animation: expandLine 3s ease-out forwards;
        }

        /* Background animation */
        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out alternate;
        }

        .shape:nth-child(1) {
            width: 150px;
            height: 150px;
            top: 10%;
            left: 15%;
            animation-duration: 18s;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 100px;
            height: 100px;
            top: 50%;
            left: 80%;
            animation-duration: 20s;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 70%;
            left: 20%;
            animation-duration: 16s;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 60%;
            animation-duration: 22s;
            animation-delay: 6s;
        }

        .shape:nth-child(5) {
            width: 120px;
            height: 120px;
            top: 85%;
            left: 50%;
            animation-duration: 17s;
            animation-delay: 8s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes expandLine {
            from { width: 0; }
            to { width: 80px; }
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
            25% { transform: translate(20px, -20px) rotate(10deg); opacity: 0.7; }
            50% { transform: translate(0, 20px) rotate(0deg); opacity: 0.9; }
            75% { transform: translate(-20px, -10px) rotate(-10deg); opacity: 0.7; }
            100% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
        }
    </style>
</head>
<body>
<div class="background-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>
<div class="container">
    <h1>A Glimpse Beyond</h1>
    <div class="decorative-line"></div>
    <p>Due to the lack of motivation, this site is completely AI generated.</p>
</div>
</body>
</html>
