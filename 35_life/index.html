<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy My Life</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: lightblue;
            color: #000;
            font-family: system-ui, sans-serif;
            padding: 2vmax;
        }
        h1 {
            font-size: 3vmax;
            margin-bottom: 1vmax;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2vmax;
            margin: 2vmax 0;
        }
        .item {
            cursor: pointer;
            border: 3px solid transparent;
            padding: 1vmax;
            transition: border-color 0.15s;
        }
        .item.selected {
            border-color: #000;
        }
        .item.sold {
            opacity: 0.4;
            cursor: default;
        }
        .item img {
            width: 100%;
            display: block;
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        .item .label {
            font-size: 1.2vmax;
            margin-top: 0.5vmax;
        }
        .item .price {
            font-size: 1vmax;
            opacity: 0.7;
        }
        .summary {
            font-size: 1.5vmax;
            margin: 2vmax 0 1vmax;
        }
        .buy-btn {
            font-family: system-ui, sans-serif;
            font-size: 1.5vmax;
            background: #fff;
            color: #000;
            border: none;
            padding: 0.8vmax 2vmax;
            cursor: pointer;
            display: none;
        }
        .buy-btn:hover {
            background: #ccc;
        }
    </style>
</head>
<body>
    <h1>Buy My Life</h1>
    <p style="font-size: 1.3vmax; opacity: 0.7;"></p>

    <div class="grid" id="grid"></div>

    <div class="summary" id="summary"></div>
    <button class="buy-btn" id="buyBtn">Buy</button>
    <a onclick="next()" style="cursor:pointer; font-size:1.3vmax;">Next</a>

    <script>
        const items = [
            { img: 'img/web/2022.jpg', label: '2022', price: 171000 },
            { img: 'img/web/2023.jpg', label: '2023', price: 168000, sold: true },
            { img: 'img/web/2024_1.jpg', label: '2024 Part 1', price: 173000 },
            { img: 'img/web/2024_2.jpg', label: '2024 Part 2', price: 149000 },
            { img: 'img/web/2025_1.jpg', label: '2025 Part 1', price: 180000 },
            { img: 'img/web/2025_2.jpg', label: '2025 Part 2', price: 190000 },
        ];

        function fmt(n) {
            return n.toLocaleString('de-CH');
        }

        const selected = new Set();
        const grid = document.getElementById('grid');
        const summary = document.getElementById('summary');
        const buyBtn = document.getElementById('buyBtn');

        items.forEach((item, i) => {
            const el = document.createElement('div');
            el.className = 'item';
            el.innerHTML = `
                <img src="${item.img}" alt="${item.label}">
                <div class="label">${item.label}</div>
                <div class="price">${item.sold ? 'Sold' : 'CHF ' + fmt(item.price)}</div>
            `;
            if (item.sold) {
                el.classList.add('sold');
            } else {
                el.addEventListener('click', () => {
                    if (selected.has(i)) selected.delete(i);
                    else selected.add(i);
                    el.classList.toggle('selected');
                    updateSummary();
                });
            }
            grid.appendChild(el);
        });

        function updateSummary() {
            if (selected.size === 0) {
                summary.textContent = '';
                buyBtn.style.display = 'none';
                return;
            }
            const total = [...selected].reduce((sum, i) => sum + items[i].price, 0);
            summary.textContent = `${selected.size} selected — CHF ${fmt(total)}`;
            buyBtn.style.display = 'inline-block';
        }

        buyBtn.addEventListener('click', () => {
            const sel = [...selected].sort().map(i => items[i]);
            const total = sel.reduce((sum, item) => sum + item.price, 0);
            const list = sel.map(item => `- ${item.label} — CHF ${fmt(item.price)}`).join('\n');

            const domain = window.location.hostname;
            const to = 'info@' + domain;
            const subject = 'Buy My Life';
            const body = `I would like to buy your life.\n\n${list}\n\nTotal: CHF ${fmt(total)}\n\nPlease get in contact with me.\n\nPS: If I don't hear back within 5 days, you're probably in the wilderness for a few weeks. I'll try again later or reach out another way in case you didn't get my mail.`;

            window.location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        });
    </script>
    <script src="../global.js"></script>
    <script>
        nav.style.display = "block";
    </script>
</body>
</html>
