<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>index giannihorst.ch</title>
</head>
<style>
    body {
        background-color: lightblue;
    }

    img {
        margin: 20px;
        border: solid 5px #555555;
        filter: drop-shadow(2px 10px 10px black);
        vertical-align: middle;
        /*animation: rotate 60s infinite ease-in-out;*/
        transform-origin: top right;
    }

    img:nth-child(odd){
        animation: rotate 60s infinite ease-in-out;
    }

    @keyframes rotate {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(-5deg);
        }
    }

    img:nth-child(even){
        animation: rotate2 60s infinite ease-in-out;
    }

    @keyframes rotate2 {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(5deg);
        }
    }

    h1 {
        text-align: center;
        opacity: 60%;
        color: darkslategray;
        font-family: "Helvetica Neue";
        font-size: 2rem;
        left: 20px;
        right:30%;
        position: relative;
        text-transform: uppercase;
        letter-spacing: -2px;
        line-height: 27px;

        /*filter: drop-shadow(1px 1px 1px black);*/
    }
    .nav {
        display: none;
    }

    .card {
        display: inline-block;
        vertical-align: top;
        text-align: center;
        margin: 10px;
        font-family: "Helvetica Neue", sans-serif;
        color: darkslategray;
    }

    .card-title {
        font-weight: bold;
        font-size: 14px;
        margin-top: 4px;
    }

    .card-description {
        font-size: 12px;
        opacity: 0.7;
    }

    .card-date {
        font-size: 11px;
        opacity: 0.5;
    }
</style>
<body>
<script src="../global.js"></script>
<h1><a href="../" style="text-decoration:none;color:inherit;">This is the<br>very good<br>Art Exhibition</a></h1>
<div id="image-container"></div>
<script>

    // Get the image-container element where you want to append the images
    const imageContainer = document.getElementById("image-container");

    const solved = JSON.parse(localStorage.getItem("solvedSites")) || [];
    let firstUnsolvedHref = null;
    let firstUnsolvedFound = false;

    siteArray.forEach((imageData, i) => {
        const isSolved = solved.includes(imageData.href) || imageData.href === "/";
        let accessible;

        if (isSolved) {
            accessible = true;
        } else if (!firstUnsolvedFound) {
            accessible = true;
            firstUnsolvedFound = true;
            firstUnsolvedHref = imageData.href;
        } else {
            accessible = false;
        }

        const imageElement = document.createElement("img");
        imageElement.src = accessible ? "img/" + imageData.img : "img/locked.png";
        if (!accessible) imageElement.style.filter = "blur(5px)";

        const anchorElement = document.createElement("a");
        if (accessible) {
            anchorElement.href = "../" + imageData.href;
        } else if (firstUnsolvedHref) {
            anchorElement.href = "../" + firstUnsolvedHref;
        }
        anchorElement.appendChild(imageElement);
        imageElement.style.width = "250px";
        imageElement.alt = imageData.title;
        imageElement.title = imageData.description;

        const card = document.createElement("div");
        card.className = "card";
        card.appendChild(anchorElement);

        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = imageData.title;
        card.appendChild(title);

        const desc = document.createElement("div");
        desc.className = "card-description";
        desc.textContent = imageData.description;
        card.appendChild(desc);

        if (imageData.created) {
            const date = document.createElement("div");
            date.className = "card-date";
            date.textContent = imageData.created;
            card.appendChild(date);
        }

        imageContainer.appendChild(card);
    });

</script>
</html>
</body>
