<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Eating Site</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 20px;
        }

        .container {
            text-align: center;
        }

        a {
            text-decoration: underline;
            display: block;
            color: blue;
        /*    margin: 20px 0;*/
        /*    cursor: pointer;*/
        }

        a:hover {
            text-decoration: underline;
        }

        #status {
            margin-top: 30px;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.8);
        }

        .status-item {
            margin: 6px 0;
            display: none;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
<script src="../global.js"></script>
    <div class="container">
        <a onclick="startRAM()">eat my ram</a>
        <a onclick="startCPU()">eat my cpu</a>
        <a onclick="startGPU()">eat my gpu</a>
        <a onclick="startAudio()">eat my DAC</a>
        <a id="stop-btn" onclick="stopAll()" style="display:none;">stop</a>
        <div id="status">
            <div class="status-item" id="status-ram"></div>
            <div class="status-item" id="status-cpu"></div>
            <div class="status-item" id="status-gpu"></div>
            <div class="status-item" id="status-audio"></div>
        </div>
        <div class="container"><a onclick="next()" style="cursor:pointer;">next</a></div>
    </div>

    <canvas id="gpu-canvas"></canvas>


    <script>
        // RAM Eater
        let ramArrays = [];
        let ramInterval;
        let audioCtx = null;
        let gpuAnimationId = null;

        function showStatus(id, text) {
            const el = document.getElementById('status-' + id);
            el.style.display = 'block';
            el.textContent = text;
            document.getElementById('stop-btn').style.display = 'block';
        }

        function stopAll() {
            // RAM
            clearInterval(ramInterval);
            clearInterval(ramStatusInterval);
            ramArrays = [];

            // CPU
            clearInterval(cpuStatusInterval);
            cpuWorkers.forEach(w => w.terminate());
            cpuWorkers = [];
            cpuOps = 0;

            // GPU
            if (gpuAnimationId) {
                cancelAnimationFrame(gpuAnimationId);
                gpuAnimationId = null;
            }
            const gpuCanvas = document.getElementById('gpu-canvas');
            gpuCanvas.style.display = 'none';
            gpuFrames = 0;
            gpuTotalCalcs = 0;

            // Audio
            clearInterval(audioStatusInterval);
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }

            // Reset status
            document.querySelectorAll('.status-item').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
            document.getElementById('stop-btn').style.display = 'none';
        }

        let ramTotalMB = 0;
        let ramStatusInterval;

        function startRAM() {
            ramTotalMB = 0;
            showStatus('ram', 'eaten 0 MB of ram');
            ramInterval = setInterval(() => {
                const chunk = new Array(12.5 * 1024 * 1024);
                for (let i = 0; i < chunk.length; i++) {
                    chunk[i] = Math.random();
                }
                ramArrays.push(chunk);
                ramTotalMB += 100;
            }, 50);
            ramStatusInterval = setInterval(() => {
                const mb = ramTotalMB;
                let ramText;
                if (mb >= 1e6) ramText = (mb / 1e6).toFixed(1) + ' terabyte';
                else if (mb >= 1e3) ramText = (mb / 1e3).toFixed(1) + ' gigabyte';
                else ramText = mb + ' megabyte';
                showStatus('ram', 'eaten ' + ramText + ' of ram');
            }, 10);
        }

        // CPU Eater
        let cpuWorkers = [];
        let cpuOps = 0;
        let cpuStatusInterval;

        function formatNumber(n) {
            if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toString();
        }

        function startCPU() {
            const numCores = navigator.hardwareConcurrency || 8;
            cpuOps = 0;
            showStatus('cpu', 'eating cpu on ' + numCores + ' cores — 0 ops');

            for (let i = 0; i < numCores; i++) {
                const workerCode = `
                    let ops = 0;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            function work() {
                                let x = 0;
                                for (let i = 0; i < 1000000; i++) {
                                    x += Math.sqrt(i) * Math.sin(i) * Math.cos(i);
                                }
                                ops += 1000000;
                                self.postMessage(ops);
                                setTimeout(work, 0);
                            }
                            work();
                        }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));
                worker.onmessage = function(e) {
                    cpuOps += 1000000;
                };
                worker.postMessage('start');
                cpuWorkers.push(worker);
            }

            cpuStatusInterval = setInterval(() => {
                let opsText;
                if (cpuOps >= 1e12) opsText = (cpuOps / 1e12).toFixed(1) + ' trillion';
                else if (cpuOps >= 1e9) opsText = (cpuOps / 1e9).toFixed(1) + ' billion';
                else if (cpuOps >= 1e6) opsText = (cpuOps / 1e6).toFixed(1) + ' million';
                else if (cpuOps >= 1e3) opsText = (cpuOps / 1e3).toFixed(1) + ' thousand';
                else opsText = cpuOps;
                showStatus('cpu', 'eating cpu on ' + numCores + ' cores — ' + opsText + ' operations');
            }, 200);
        }

        // GPU Eater
        let gpuFrames = 0;
        let gpuLastTime = 0;
        let gpuFps = 0;
        let gpuTotalCalcs = 0;

        function startGPU() {
            showStatus('gpu', 'eating gpu — 0 frames rendered');
            const gpuCanvas = document.getElementById('gpu-canvas');
            gpuCanvas.width = 2048;
            gpuCanvas.height = 2048;
            gpuCanvas.style.display = 'block';

            const gl = gpuCanvas.getContext('webgl2') || gpuCanvas.getContext('webgl');

            if (!gl) {
                alert('WebGL not supported');
                return;
            }

            const vertexShaderSource = `
                attribute vec2 position;
                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            const fragmentShaderSource = `
                precision highp float;
                uniform float time;
                uniform vec2 resolution;

                void main() {
                    vec2 uv = gl_FragCoord.xy / resolution;
                    vec3 color = vec3(0.0);

                    for(int i = 0; i < 100; i++) {
                        float fi = float(i);
                        uv = abs(uv);
                        uv = uv * 2.0 - 1.0;
                        uv = uv * mat2(cos(time + fi), sin(time + fi), -sin(time + fi), cos(time + fi));
                        color += abs(sin(uv.x * 10.0 + time + fi) * cos(uv.y * 10.0 + time + fi)) * vec3(
                            sin(fi * 0.1),
                            cos(fi * 0.15),
                            sin(fi * 0.2)
                        );
                    }

                    gl_FragColor = vec4(color, 1.0);
                }
            `;

            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, vertexShaderSource);
            gl.compileShader(vertexShader);

            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, fragmentShaderSource);
            gl.compileShader(fragmentShader);

            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            gl.useProgram(program);

            const vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

            const positionLocation = gl.getAttribLocation(program, 'position');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            const timeLocation = gl.getUniformLocation(program, 'time');
            const resolutionLocation = gl.getUniformLocation(program, 'resolution');

            let startTime = Date.now();
            gpuLastTime = startTime;

            function render() {
                const now = Date.now();
                const time = (now - startTime) * 0.001;
                gl.uniform1f(timeLocation, time);
                gl.uniform2f(resolutionLocation, gpuCanvas.width, gpuCanvas.height);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                for (let i = 0; i < 10; i++) {
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                }

                gpuFrames++;
                gpuTotalCalcs += gpuCanvas.width * gpuCanvas.height * 100 * 11;

                if (gpuFrames % 10 === 0) {
                    const elapsed = (now - gpuLastTime) / 1000;
                    gpuFps = Math.round(10 / elapsed);
                    gpuLastTime = now;

                    if (gpuFps < 5 && gpuCanvas.width > 64) {
                        gpuCanvas.width = Math.round(gpuCanvas.width * 0.8);
                        gpuCanvas.height = Math.round(gpuCanvas.height * 0.8);
                        gl.viewport(0, 0, gpuCanvas.width, gpuCanvas.height);
                    }

                    let calcText;
                    if (gpuTotalCalcs >= 1e15) calcText = (gpuTotalCalcs / 1e15).toFixed(1) + ' quadrillion';
                    else if (gpuTotalCalcs >= 1e12) calcText = (gpuTotalCalcs / 1e12).toFixed(1) + ' trillion';
                    else if (gpuTotalCalcs >= 1e9) calcText = (gpuTotalCalcs / 1e9).toFixed(1) + ' billion';
                    else if (gpuTotalCalcs >= 1e6) calcText = (gpuTotalCalcs / 1e6).toFixed(1) + ' million';
                    else calcText = gpuTotalCalcs;

                    showStatus('gpu', 'eating gpu: ' + calcText + ' calculations');
                }
                gpuAnimationId = requestAnimationFrame(render);
            }

            render();
        }

        // Audio Eater
        let audioStatusInterval;

        function startAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioContext = audioCtx;
            const sampleRate = audioContext.sampleRate;

            showStatus('audio', 'eating audio — 100 oscillators @ ' + sampleRate + ' Hz — 0 samples');

            for (let i = 0; i < 100; i++) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.type = ['sine', 'square', 'sawtooth', 'triangle'][i % 4];
                oscillator.frequency.setValueAtTime(Math.random() * 2000 + 100, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.01, audioContext.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.start();
            }

            audioStatusInterval = setInterval(() => {
                const samples = Math.floor(audioContext.currentTime * sampleRate);
                showStatus('audio', 'eating audio — 100 oscillators @ ' + sampleRate + ' Hz — ' + formatNumber(samples * 100) + ' samples');
            }, 200);
        }
    </script>
</body>
</html>
